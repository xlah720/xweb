<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>页面不存在 · 刷题</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#2a303b;--fg:#e6e9ef;--dim:#9aa4b2;--accent:#4f8cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:var(--bg);color:var(--fg);
font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:32px 36px;text-align:center;max-width:420px;margin:20px}
h1{margin:0 0 8px;font-size:22px}
p{margin:0 0 18px;color:var(--dim);font-size:14px}
a{display:inline-block;padding:10px 20px;border-radius:10px;background:var(--accent);
color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <p>这个地址没有题目，回首页继续刷。</p>
  <a href="./">返回首页</a>
</div>
</body>
</html>
